<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Верле: 1D-цепочка масс на пружинах</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<style>
  html, body { margin: 0; background: #0f1115; color: #cfd4dc;
               font-family: system-ui, sans-serif; }
  #hint { position: fixed; left: 14px; bottom: 10px; font-size: 13px; color: #8a94a6; }
</style>
</head>
<body>
<div id="hint">пробел — перезапуск щелчка по центру · клик по цепочке — щёлкнуть в этом месте · ↑/↓ — сила</div>
<script>
// ---- модель (та же, что в app.c): a[i] = x[i-1] + x[i+1] - 2*x[i], k = m = 1 ----
const N = 60;          // число масс
let x, xprev;          // положение и предыдущее положение (Верле)
const dt = 0.2;        // шаг по времени (маленький -> устойчиво)
const SUBSTEPS = 3;    // шагов симуляции на кадр
let center;
let amp = 1.0;         // амплитуда щелчка

let trace = [];        // след центральной массы во времени
const MARGIN = 70;
let gap, baseY, scaleY;

function setup() {
  createCanvas(940, 520);
  center = Math.floor(N / 2);
  gap = (width - 2 * MARGIN) / (N - 1);
  baseY = height * 0.40;
  scaleY = 130;
  pluckCenter();
}

function pluckCenter() {          // гауссов бугор по центру, старт из покоя
  x = new Array(N).fill(0);
  const sigma = 3;
  for (let i = 0; i < N; i++)
    x[i] = amp * Math.exp(-((i - center) ** 2) / (2 * sigma * sigma));
  x[0] = 0; x[N - 1] = 0;         // концы закреплены
  xprev = x.slice();              // x_prev = x  ->  нулевая скорость
  trace = [];
}

function step() {                 // один шаг Верле
  const xnew = new Array(N);
  xnew[0] = x[0];
  xnew[N - 1] = x[N - 1];         // концы неподвижны
  for (let i = 1; i < N - 1; i++) {
    const a = x[i - 1] + x[i + 1] - 2 * x[i];   // сила пружин
    xnew[i] = 2 * x[i] - xprev[i] + a * dt * dt; // Верле
  }
  xprev = x;
  x = xnew;
  trace.push(x[center]);
  if (trace.length > width - 2 * MARGIN) trace.shift();
}

function draw() {
  background(15, 17, 21);
  for (let s = 0; s < SUBSTEPS; s++) step();

  const px = i => MARGIN + i * gap;
  const py = v => baseY - v * scaleY;

  // линия равновесия
  stroke(55, 60, 70); strokeWeight(1);
  line(MARGIN, baseY, width - MARGIN, baseY);

  // пружины (ломаная по вершинам-массам)
  stroke(120, 130, 150); strokeWeight(2); noFill();
  beginShape();
  vertex(MARGIN - 30, baseY);                 // левая стена
  for (let i = 0; i < N; i++) vertex(px(i), py(x[i]));
  vertex(width - MARGIN + 30, baseY);         // правая стена
  endShape();

  // массы
  noStroke();
  for (let i = 0; i < N; i++) {
    if (i === 0 || i === N - 1) fill(90, 98, 112);
    else if (i === center) fill(214, 69, 69);
    else fill(79, 131, 204);
    const d = (i === center) ? 15 : (i === 0 || i === N - 1 ? 13 : 9);
    circle(px(i), py(x[i]), d);
  }

  // стены
  fill(70, 76, 88); noStroke();
  rect(MARGIN - 40, baseY - 45, 10, 90);
  rect(width - MARGIN + 30, baseY - 45, 10, 90);

  // след центральной массы внизу
  const ty = height * 0.82;
  stroke(55, 60, 70); strokeWeight(1);
  line(MARGIN, ty, width - MARGIN, ty);
  stroke(214, 69, 69); strokeWeight(1.5); noFill();
  beginShape();
  for (let j = 0; j < trace.length; j++) vertex(MARGIN + j, ty - trace[j] * scaleY * 0.6);
  endShape();

  // подписи
  noStroke(); fill(207, 212, 220); textSize(14);
  text("Верле, 1D-цепочка:  горизонталь — номер массы i,  вертикаль — смещение x[i]", MARGIN, 26);
  fill(214, 69, 69); textSize(13);
  text("центральная масса x[N/2] (красная) — её след во времени ниже", MARGIN, ty - 16);
}

function keyPressed() {
  if (key === ' ') pluckCenter();
  if (keyCode === UP_ARROW)   { amp = Math.min(amp * 1.3, 4); pluckCenter(); }
  if (keyCode === DOWN_ARROW) { amp = Math.max(amp / 1.3, 0.2); pluckCenter(); }
}

function mousePressed() {          // щелчок в точке клика (добавляем бугор в покое)
  const i = Math.round((mouseX - MARGIN) / gap);
  if (i > 0 && i < N - 1) {
    const sigma = 2.5;
    for (let j = 0; j < N; j++) {
      const d = amp * Math.exp(-((j - i) ** 2) / (2 * sigma * sigma));
      x[j] += d; xprev[j] += d;   // += к обоим -> добавка без скорости, старое движение живёт
    }
    x[0] = x[N - 1] = 0; xprev[0] = xprev[N - 1] = 0;
  }
}
</script>
</body>
</html>
